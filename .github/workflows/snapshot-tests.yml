name: Front-end tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  snapshot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Worker and PNG tests
        run: |
          mkdir -p dist/tests
          g++ -std=c++11 -Wall -Wextra -pthread -fsanitize=address,undefined -Itests/shims -Ifceux/xbox tests/snapshot_test.cpp fceux/xbox/snapshot_worker.cpp -lz -o /tmp/snapshot-test
          cd dist/tests
          /tmp/snapshot-test
          python ../../tests/check_png.py
      - name: Gameplay shortcut tests
        run: |
          g++ -std=c++98 -Wall -Wextra -Werror -fsanitize=address,undefined -Ifceux/xbox tests/gameplay_shortcuts_test.cpp -o /tmp/gameplay-shortcuts-test
          /tmp/gameplay-shortcuts-test
      - name: Gameplay scene navigation tests
        run: python tests/check_gameplay_scene.py
